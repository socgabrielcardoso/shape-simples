<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Detector de Formas</title>
  <link rel="stylesheet" href="./css/style.css">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Shape Simples | Computer Vision Lab">
  <meta property="og:description" content="Lightweight browser computer-vision lab for hand-shape recognition and webcam experimentation.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Shape Simples | Computer Vision Lab">
  <meta name="twitter:description" content="Lightweight browser computer-vision lab for hand-shape recognition and webcam experimentation.">
</head>
<body>
  <main class="viewer">
    <video id="camera" autoplay muted playsinline></video>
    <canvas id="visionCanvas"></canvas>

    <section class="results">
      <article class="result">
        <span>FORMA</span>
        <strong id="shapeName">NENHUMA</strong>
      </article>
      <article class="result">
        <span>ESTADO</span>
        <strong id="eyeState">AGUARDANDO</strong>
      </article>
    </section>

    <button id="startButton" type="button">CARREGANDO</button>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
